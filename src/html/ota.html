<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OTA Update</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #333;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin: 0 auto;
        }
        
        .header {
            background: #ffffff;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .title {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 600;
            color: #333;
            line-height: 1.2;
        }
        
        .ip-info {
            font-size: 0.85rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .content {
            padding: 20px;
        }
        
        .warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-left: 4px solid #f39c12;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 0 4px 4px 0;
            color: #856404;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }
        
        .form-control {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            background: #fff;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #4a86e8;
            box-shadow: 0 0 0 2px rgba(74, 134, 232, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 48px;
            touch-action: manipulation;
        }
        
        .btn-primary {
            background: #4a86e8;
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #357abd;
        }
        
        .btn-primary:active {
            background: #2c6bb3;
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .progress-container {
            margin: 20px 0;
            background: #f5f5f5;
            border-radius: 6px;
            overflow: hidden;
            height: 36px;
            position: relative;
        }
        
        .progress-bar {
            height: 100%;
            background: #4a86e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: white;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #333;
            z-index: 10;
            pointer-events: none;
        }
        
        .status-section {
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            background: #fafafa;
        }
        
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .status-title {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        .md5-info {
            font-size: 11px;
            color: #666;
            text-align: right;
            flex: 1;
            min-width: 0;
        }
        
        .md5-value {
            font-family: monospace;
            font-size: 10px;
            word-break: break-all;
            color: #2980b9;
            display: block;
            margin-top: 2px;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
            align-items: center;
        }
        
        .status-label {
            color: #666;
            flex-shrink: 0;
        }
        
        .status-value {
            font-weight: 500;
            color: #333;
            text-align: right;
            flex-shrink: 0;
        }
        
        .status-success {
            color: #27ae60 !important;
        }
        
        .status-warning {
            color: #f39c12 !important;
        }
        
        .status-error {
            color: #e74c3c !important;
        }
        
        .device-info {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            gap: 10px;
        }
        
        .info-item {
            padding: 10px 5px;
            flex: 1;
            min-width: 0;
        }
        
        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4a86e8;
            margin-bottom: 5px;
            word-break: break-word;
        }
        
        .info-sn {
            font-size: 1rem;
            font-weight: 600;
            color: #4a86e8;
            text-transform: lowercase;
            margin-bottom: 5px;
            word-break: break-word;
        }
        
        .info-label {
            font-size: 11px;
            color: #666;
            line-height: 1.2;
        }
        
        .flashing {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .d-none {
            display: none;
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            
            .container {
                border-radius: 0;
                box-shadow: none;
                margin: 0;
                height: 100vh;
                max-width: 100%;
                display: flex;
                flex-direction: column;
            }
            
            .header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                gap: 8px;
            }
            
            .title {
                font-size: 1.3rem;
            }
            
            .ip-info {
                font-size: 0.8rem;
                justify-content: center;
            }
            
            .content {
                padding: 16px;
                flex: 1;
                overflow-y: auto;
            }
            
            .warning {
                font-size: 0.85rem;
                padding: 10px 12px;
            }
            
            .form-control {
                padding: 12px;
                font-size: 16px;
            }
            
            .btn {
                padding: 12px;
                font-size: 16px;
                min-height: 44px;
            }
            
            .progress-container {
                height: 32px;
                margin: 16px 0;
            }
            
            .progress-text {
                font-size: 13px;
            }
            
            .status-section {
                padding: 12px;
                margin-top: 16px;
            }
            
            .status-header {
                flex-direction: column;
                align-items: stretch;
                text-align: left;
            }
            
            .md5-info {
                text-align: left;
                font-size: 10px;
            }
            
            .md5-value {
                font-size: 9px;
            }
            
            .status-row {
                font-size: 13px;
                margin: 6px 0;
            }
            
            .device-info {
                margin-top: 16px;
                padding-top: 12px;
                gap: 5px;
            }
            
            .info-item {
                padding: 8px 2px;
            }
            
            .info-value {
                font-size: 1rem;
            }
            
            .info-sn {
                font-size: 0.9rem;
            }
            
            .info-label {
                font-size: 10px;
            }
        }

        @media (max-width: 360px) {
            .content {
                padding: 12px;
            }
            
            .form-control {
                padding: 10px;
                font-size: 16px;
            }
            
            .btn {
                padding: 10px;
                font-size: 15px;
            }
            
            .progress-container {
                height: 28px;
            }
            
            .progress-text {
                font-size: 12px;
            }
        }

        /* 平板端适配 */
        @media (min-width: 768px) and (max-width: 1024px) {
            body {
                padding: 15px;
            }
            
            .container {
                max-width: 450px;
            }
            
            .header {
                padding: 18px 24px;
            }
            
            .title {
                font-size: 1.5rem;
            }
            
            .content {
                padding: 24px;
            }
        }

        /* 高分辨率屏幕适配 */
        @media (min-width: 1200px) {
            .container {
                max-width: 520px;
            }
        }

        /* 横屏适配 */
        @media (orientation: landscape) and (max-height: 500px) {
            body {
                align-items: flex-start;
                padding-top: 10px;
            }
            
            .container {
                max-height: calc(100vh - 20px);
            }
            
            .content {
                max-height: calc(100vh - 120px);
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">OTA升级系统</h1>
            <div class="ip-info">
                <span>设备IP:</span>
                <span id="deviceIP" style="font-family: monospace; background: #f5f5f5; padding: 2px 6px; border-radius: 3px; font-size: 0.8rem;">连接中...</span>
            </div>
        </div>
        
        <div class="content">
            <div class="warning">
                <strong>⚠️ 警告:</strong> 更新过程中请勿断开设备电源或网络连接！
            </div>
            
            <form id="uploadForm">
                <div class="form-group">
                    <label class="form-label" for="firmwareFile">选择固件文件（.bin格式）</label>
                    <input class="form-control" type="file" id="firmwareFile" name="update" accept=".bin" required>
                </div>
                <button type="submit" class="btn btn-primary" id="updateBtn">
                    <span id="btnText">开始更新</span>
                    <span id="btnSpinner" class="spinner d-none"></span>
                </button>
            </form>
            
            <div class="progress-container">
                <div id="progressBar" class="progress-bar" style="width: 0%;"></div>
                <div id="progressText" class="progress-text">0%</div>
            </div>
            
            <div class="status-section">
                <div class="status-header">
                    <h3 class="status-title">系统状态</h3>
                    <div class="md5-info">
                        固件MD5: <span id="firmwareMD5" class="md5-value">N/A</span>
                    </div>
                </div>
                
                <div class="status-row">
                    <span class="status-label">更新进度：</span>
                    <span id="uploadPercent" class="status-value">0%</span>
                </div>
                <div class="status-row">
                    <span class="status-label">系统状态：</span>
                    <span id="statusText" class="status-value">就绪</span>
                </div>
                <div class="status-row">
                    <span class="status-label">更新时长：</span>
                    <span id="updateDuration" class="status-value">--:--</span>
                </div>
            </div>
            
            <div class="device-info">
                <div class="info-item">
                    <div class="info-value" id="fwVersion">N/A</div>
                    <div class="info-label">固件版本</div>
                </div>
                <div class="info-item">
                    <div class="info-value" id="flashSize">N/A</div>
                    <div class="info-label">可用空间</div>
                </div>
                <div class="info-item">
                    <div class="info-sn" id="SNID">N/A</div>
                    <div class="info-label">序列号</div>
                </div>
            </div>
        </div>
    </div>

<script>
    // 全局变量
    let updateStartTime = null;
    let updateTimer = null;

    // 格式化时间显示
    function formatDuration(seconds) {
        if (seconds < 0 || isNaN(seconds)) {
            return '--:--';
        }
        
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // 开始计时
    function startUpdateTimer() {
        updateStartTime = Date.now();
        
        // 清除之前的计时器
        if (updateTimer) {
            clearInterval(updateTimer);
        }
        
        // 立即显示 00:00
        document.getElementById('updateDuration').textContent = '00:00';
        
        // 每秒更新一次
        updateTimer = setInterval(() => {
            if (updateStartTime) {
                const elapsedSeconds = (Date.now() - updateStartTime) / 1000;
                document.getElementById('updateDuration').textContent = formatDuration(elapsedSeconds);
            }
        }, 1000);
    }

    // 停止计时
    function stopUpdateTimer() {
        if (updateTimer) {
            clearInterval(updateTimer);
            updateTimer = null;
        }
    }

    // 重置计时器
    function resetUpdateTimer() {
        stopUpdateTimer();
        updateStartTime = null;
        document.getElementById('updateDuration').textContent = '--:--';
    }

    // 获取设备信息
    async function fetchDeviceInfo() {
        try {
            const response = await fetch('/info');
            if (!response.ok) {
                throw new Error('无法连接到设备');
            }
            
            const data = await response.json();
            
            // 更新设备信息
            document.getElementById('fwVersion').textContent = data.version || 'N/A';
            document.getElementById('flashSize').textContent = 
                data.freeFlash ? `${data.freeFlash} KB` : 'N/A';
            document.getElementById('SNID').textContent = data.SNID || 'N/A';
            document.getElementById('firmwareMD5').textContent = data.firmwareMD5 || 'N/A';
            
            // 显示设备IP地址
            const ipAddress = data.ipAddress;
            const ipElement = document.getElementById('deviceIP');
            if (ipAddress) {
                ipElement.textContent = ipAddress;
                
                // 复制功能
                ipElement.title = "点击复制IP地址";
                ipElement.addEventListener('click', function() {
                    navigator.clipboard.writeText(ipAddress);
                    const originalText = ipElement.textContent;
                    ipElement.textContent = '已复制!';
                    setTimeout(() => {
                        ipElement.textContent = originalText;
                    }, 2000);
                });
            } else {
                ipElement.textContent = '未获取到IP';
            }
            
        } catch (error) {
            console.error('获取设备信息失败:', error);
            document.getElementById('statusText').textContent = '连接错误';
            document.getElementById('statusText').className = 'status-value status-error';
            
            // 尝试直接获取当前访问的IP
            const currentHost = window.location.hostname;
            if (currentHost && currentHost !== 'esp32.local') {
                document.getElementById('deviceIP').textContent = currentHost;
            } else {
                document.getElementById('deviceIP').textContent = '无法获取IP';
            }
            
            // 设置重试机制
            setTimeout(fetchDeviceInfo, 5000);
        }
    }
    
    // 更新进度显示
    function updateProgress(uploadPercent) {
        uploadPercent = Math.max(0, Math.min(100, uploadPercent));
        document.getElementById('uploadPercent').textContent = `${uploadPercent}%`;
        const progressBar = document.getElementById('progressBar');
        progressBar.style.width = `${uploadPercent}%`;
        document.getElementById('progressText').textContent = `${uploadPercent}%`;
        
        const statusText = document.getElementById('statusText');
        if (uploadPercent < 100) {
            statusText.textContent = '上传中...';
            statusText.className = 'status-value';
            progressBar.style.background = '#4a86e8';
        } else {
            statusText.textContent = '正在写入设备...';
            statusText.className = 'status-value status-warning';
            progressBar.style.background = '#f39c12';
            progressBar.classList.add('flashing');
        }
    }
    
    // 表单提交处理
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('updateBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('btnSpinner');
        const fileInput = document.getElementById('firmwareFile');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        
        // 重置计时器和进度
        resetUpdateTimer();
        progressBar.classList.remove('flashing');
        updateProgress(0);
        
        // 检查文件是否已选择
        if (!fileInput.files || fileInput.files.length === 0) {
            statusText.textContent = '未选择文件';
            statusText.className = 'status-value status-error';
            return;
        }
        
        // 检查文件扩展名
        const fileName = fileInput.files[0].name.toLowerCase();
        if (!fileName.endsWith('.bin')) {
            statusText.textContent = '仅支持.bin文件';
            statusText.className = 'status-value status-error';
            return;
        }
        
        // 获取文件大小
        const file = fileInput.files[0];
        const fileSize = file.size;
        
        // 创建XHR对象
        const xhr = new XMLHttpRequest();
        const formData = new FormData();
        formData.append('update', file);
        
        // 创建包含文件大小的URL
        const url = `/update?fileSize=${fileSize}`;
        
        // 禁用按钮并显示加载状态
        btn.disabled = true;
        btnText.textContent = '更新中...';
        spinner.classList.remove('d-none');
        statusText.textContent = '开始上传';
        statusText.className = 'status-value';
        
        // 开始计时
        startUpdateTimer();
        
        // 上传进度处理
        xhr.upload.addEventListener('progress', function(evt) {
            // 使用fileSize而不是evt.total，因为evt.total可能包含额外数据
            const percent = Math.round((evt.loaded / fileSize) * 100);
            updateProgress(percent);
        });
        
        // 请求完成处理
        xhr.addEventListener('load', async function() {
            if (xhr.status === 200) {
                updateProgress(100);

                statusText.textContent = '更新成功';
                statusText.className = 'status-value status-success';
                progressBar.style.background = '#27ae60';
                progressBar.classList.remove('flashing');
                
                // 停止计时，显示最终时长
                stopUpdateTimer();
                if (updateStartTime) {
                    const finalDuration = (Date.now() - updateStartTime) / 1000;
                    document.getElementById('updateDuration').textContent = formatDuration(finalDuration);
                }
                
                let countdown = 3;
                const countdownInterval = setInterval(() => {
                    btnText.textContent = `重启中...(${countdown})`;
                    if (countdown <= 0) {
                        clearInterval(countdownInterval);
                        btnText.textContent = '请手动刷新后操作';
                        setTimeout(fetchDeviceInfo, 3000);
                    }
                    countdown--;
                }, 1000);
            } else {
                btn.disabled = false;
                btnText.textContent = '重试更新';
                spinner.classList.add('d-none');
                statusText.textContent = '更新失败';
                statusText.className = 'status-value status-error';
                progressBar.style.background = '#e74c3c';
                
                // 停止计时
                stopUpdateTimer();
                resetUpdateTimer();
            }
        });
        
        // 错误处理
        xhr.addEventListener('error', function() {
            btn.disabled = false;
            btnText.textContent = '重试更新';
            spinner.classList.add('d-none');
            statusText.textContent = '连接错误';
            statusText.className = 'status-value status-error';
            
            // 停止计时
            stopUpdateTimer();
            resetUpdateTimer();
        });
        
        // 请求超时处理
        xhr.timeout = 300000; // 5分钟超时
        xhr.ontimeout = function() {
            btn.disabled = false;
            btnText.textContent = '重试更新';
            spinner.classList.add('d-none');
            statusText.textContent = '请求超时';
            statusText.className = 'status-value status-error';
            
            // 停止计时
            stopUpdateTimer();
            resetUpdateTimer();
        };
        
        // 发送请求
        xhr.open('POST', url, true);
        xhr.send(formData);
    });
    
    // 初始化页面时获取设备信息
    document.addEventListener('DOMContentLoaded', fetchDeviceInfo);
    
    // 每10秒刷新一次设备信息
    setInterval(fetchDeviceInfo, 10000);
</script>
</body>
</html>
